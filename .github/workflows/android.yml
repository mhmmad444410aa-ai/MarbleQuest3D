name: Prototype Android verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk" --version
          "$manager" --sdk_root="$sdk" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'platforms;android-36' 'build-tools;36.0.0'
          test -x "$sdk/build-tools/35.0.1/apksigner"
      - name: Fetch official Godot and matching templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.config/godot"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.6.tres"
          godot --version
      - name: Fetch licensed original assets
        run: python3 tools/fetch_assets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original HD material artwork
        run: |
          python3 -m pip install --only-binary=:all: numpy==2.2.6 Pillow==11.3.0
          python3 tools/generate_materials.py
      - name: Generate original non-musical sound effects
        run: python3 tools/generate_sfx.py
      - name: Import assets
        run: godot --headless --path . --editor --import > import.log 2>&1 || (cat import.log; exit 1)
      - name: Smoke test
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/godot-smoke-data"
          timeout 1450 godot --headless --path . --script tools/smoke.gd 2>&1 | tee smoke.log
          grep -q SMOKE_OK smoke.log
          test "$(grep -c FULL_COURSE_OK smoke.log)" -eq 24
          if grep -E 'SCRIPT ERROR|Parse Error' import.log smoke.log; then exit 1; fi
      - name: Export and sign prototype
        env:
          KS_B64: ''
          KS_PASS: ''
          KEY_ALIAS: ''
          KEY_PASS: ''
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/quest.jks"
          trap 'rm -f "$ks"' EXIT
          expected=com.mhmmad.marblequest3d
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS_B64" | base64 --decode > "$ks"
          else
            expected=com.mhmmad.marblequest3d.prototype
            sed -i "s/com.mhmmad.marblequest3d\"/$expected\"/" export_presets.cfg
            export KS_PASS="$(openssl rand -hex 24)" KEY_ALIAS=prototype
            export KEY_PASS="$KS_PASS"
            keytool -genkeypair -keystore "$ks" -storetype JKS -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Marble Quest Prototype'
          fi
          mkdir -p build
          godot --headless --path . --export-release Android build/unsigned.apk
          test -s build/unsigned.apk
          test "$(stat -c%s build/unsigned.apk)" -gt 81105297
          bt="$ANDROID_HOME/build-tools/35.0.1"
          "$bt/zipalign" -P 16 -f 4 build/unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out build/MarbleQuest3D-prototype.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --verbose --print-certs build/MarbleQuest3D-prototype.apk | tee build/certificate.txt
          "$bt/aapt" dump badging build/MarbleQuest3D-prototype.apk > build/badging.txt
          grep -Fq "package: name='$expected'" build/badging.txt
          "$bt/zipalign" -c -P 16 4 build/MarbleQuest3D-prototype.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('build/MarbleQuest3D-prototype.apk') as z:
              assert z.testzip() is None
              for abi in ['arm64-v8a','armeabi-v7a']:
                  assert any(n.startswith(f'lib/{abi}/') and n.endswith('.so') for n in z.namelist()), abi
          PY
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MarbleQuest3D-signed-prototype
          path: |
            build/MarbleQuest3D-prototype.apk
            build/certificate.txt
            build/badging.txt
            assets/source.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MarbleQuest3D-APK-only
          path: build/MarbleQuest3D-prototype.apk
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prototype-diagnostics
          path: |
            import.log
            smoke.log
          if-no-files-found: ignore

  direct-apk:
    name: Publish direct APK
    needs: prototype
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarbleQuest3D-APK-only
          path: release
      - name: Verify and publish test APK without ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mv MarbleQuest3D-prototype.apk MarbleQuest3D.apk
          unzip -tq MarbleQuest3D.apk
          sha256sum MarbleQuest3D.apk > SHA256SUMS.txt
          tag="test-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" MarbleQuest3D.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Marble Quest 3D - verified test APK" --notes "Direct Android APK from a successful build and automated smoke test. Test builds may use a different signing certificate from previous builds; not a production store release."
          gh release view "$tag" --json url,assets
